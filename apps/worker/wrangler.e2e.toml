name = "vibeflare-e2e"
main = "test/e2e-entry.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
RP_NAME = "VibeFlare E2E"
RP_ID = "localhost"
RP_ORIGIN = "http://localhost:8788"
AUTH_MODE = "standalone"
SESSION_SECRET = "e2e-session-secret-not-for-production"
CF_ACCOUNT_ID = "e2e"
CF_API_TOKEN = "e2e"
E2E_TEST_MODE = "1"

[[d1_databases]]
binding = "DB"
database_name = "vibeflare-e2e"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "vibeflare-e2e-files"

[assets]
binding = "ASSETS"
directory = "../ui/dist"
not_found_handling = "none"
run_worker_first = ["/", "/signup", "/signup/*"]

[durable_objects]
bindings = [
  { name = "QUOTA", class_name = "QuotaCounter" },
  { name = "AUTH_RL", class_name = "AuthRateLimiter" },
  { name = "CRON", class_name = "CronScheduler" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthRateLimiter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CronScheduler"]
